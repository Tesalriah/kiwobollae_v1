spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    # local과 동일한 이유(위 application-local.yaml 주석 참고) — ddl-auto: update가
    # 스키마를 먼저 맞춘 뒤에 시드 SQL이 실행되도록 순서를 뒤집는다.
    defer-datasource-initialization: true
  sql:
    init:
      # 기존 InitData류 ApplicationRunner의 @Profile({"local","prod"}) 대체. charge-products는
      # 운영에서 자동 생성하지 않던 것과 동일하게 dev-seed-charge-products.sql을 빼고 로드한다.
      mode: always
      data-locations: classpath:dev-seed-data.sql

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:https://kiwor.site,https://www.kiwor.site}
  cookie:
    secure: ${COOKIE_SECURE:true}
  mail:
    # 운영은 기본값 없이 명시적으로 true를 요구 — 설정을 빠뜨리면 기동 자체가 실패해서
    # "이메일이 콘솔에만 찍히고 실제로는 안 나가는" 상태로 조용히 배포되는 걸 막는다.
    enabled: ${MAIL_ENABLED}
    from: ${MAIL_FROM}
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_REDIRECT_URI}
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET}
      redirect-uri: ${KAKAO_REDIRECT_URI}
    naver:
      client-id: ${NAVER_CLIENT_ID}
      client-secret: ${NAVER_CLIENT_SECRET}
      redirect-uri: ${NAVER_REDIRECT_URI}
  seed:
    # 옛 InitData 계열이 만들던 테스트 계정/샘플 데이터는 이제 dev-seed-data.sql로 들어간다
    # (spring.sql.init 설정 참고) — ddl-auto: update처럼 배포 편의를 위한 임시 조치이며,
    # 실제 서비스 오픈 전에는 반드시 spring.sql.init.mode를 꺼야 한다. 운영 충전 상품만은
    # 관리자 콘솔에서 구성하므로 dev-seed-charge-products.sql을 data-locations에서 제외했다.

payment:
  toss:
    base-url: ${TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY}
